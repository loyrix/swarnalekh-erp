name: swarnbook
description: SwarnaLekh — Multi-tenant jewellery shop management SaaS
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Supabase Auth (OTP flow only — all other requests go through NestJS API)
  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Internationalization
  intl: ^0.20.2

  # UI
  image: ^4.8.0
  image_picker: ^1.2.1
  printing: ^5.14.3
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  fl_chart: ^1.2.0
  flutter_secure_storage: ^10.3.1
  pdf: ^3.13.0

  # Inventory import from other ERPs (CSV / Excel). xlsx is read with a small
  # in-repo parser over archive + xml (the heavy Excel packages pin xml <7,
  # which clashes with pdf's xml ^7).
  file_picker: ^8.1.4
  csv: ^6.0.0
  archive: ^4.0.2
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.2

  # Linting
  flutter_lints: ^5.0.0

  # Testing
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/swarnalekh-logo.png
    - assets/brand/swarnalekh-mark.png
    - assets/brand/swarnalekh-mark-transparent.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/swarnalekh-mark.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/brand/swarnalekh-mark.png"
    background_color: "#161B22"
    theme_color: "#161B22"
